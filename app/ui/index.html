<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fermata</title>
<style>
  :root{
    --bg:#eceff3;
    --panel:rgba(255,255,255,.78);
    --panel-solid:#ffffff;
    --stroke:rgba(15,23,42,.09);
    --stroke-strong:rgba(15,23,42,.16);
    --text:#111827;
    --muted:#5c6b7f;
    --faint:#8a97a8;
    --accent:#15a34a;
    --accent-soft:rgba(21,163,74,.12);
    --warn:#d97706;
    --warn-soft:rgba(217,119,6,.14);
    --danger:#dc2626;
    --danger-soft:rgba(220,38,38,.12);
    --idle:#94a3b8;
    --radius:14px;
    --shadow:0 1px 2px rgba(15,23,42,.05), 0 8px 28px rgba(15,23,42,.07);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei",
                system-ui,-apple-system,sans-serif;
    font-size:13.5px;
    color:var(--text);
    background:
      radial-gradient(1100px 480px at 12% -12%, #ffffff 0%, rgba(255,255,255,0) 62%),
      radial-gradient(900px 460px at 108% 4%, #e2ebf5 0%, rgba(226,235,245,0) 58%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  /* Fixed-height shell: header / tabs / scrolling body / footer.
     Keeping the footer outside the scroll area is what stops the window from
     growing into one long page. */
  .app{height:100vh;display:flex;flex-direction:column;max-width:880px;
       margin:0 auto;padding:18px 20px 16px}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex:none}
  .mark{
    width:34px;height:34px;border-radius:10px;flex:none;
    background:linear-gradient(150deg,#1f2b3a,#33465e);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(15,23,42,.18);
  }
  .mark span{width:11px;height:11px;border-radius:50%;background:var(--idle);
             transition:background .25s}
  .mark.live span{background:#4ade80}
  .titles{min-width:0}
  h1{font-size:15.5px;font-weight:600;margin:0;letter-spacing:.01em}
  .sub{font-size:11.5px;color:var(--faint);margin-top:1px;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spacer{flex:1}

  .status-pill{
    display:inline-flex;align-items:center;gap:7px;flex:none;
    padding:6px 12px;border-radius:999px;
    font-size:12px;font-weight:600;letter-spacing:.02em;
    background:rgba(148,163,184,.16);color:var(--muted);
    border:1px solid transparent;
    transition:background .25s,color .25s,border-color .25s;
  }
  .status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--idle)}
  .status-pill.running{background:var(--accent-soft);color:#12743a;border-color:rgba(21,163,74,.22)}
  .status-pill.running .dot{background:var(--accent);box-shadow:0 0 0 3px rgba(21,163,74,.18)}
  .status-pill.waiting{background:var(--warn-soft);color:#a35c05;border-color:rgba(217,119,6,.22)}
  .status-pill.waiting .dot{background:var(--warn)}
  .status-pill.error{background:var(--danger-soft);color:#b91c1c;border-color:rgba(220,38,38,.22)}
  .status-pill.error .dot{background:var(--danger)}

  /* ---------- tabs ---------- */
  nav.tabs{
    display:flex;gap:2px;flex:none;margin-bottom:12px;
    background:rgba(148,163,184,.16);border-radius:11px;padding:3px;
  }
  nav.tabs button{
    flex:1;font:inherit;font-size:13px;font-weight:500;color:var(--muted);
    background:transparent;border:none;border-radius:8px;
    padding:8px 10px;cursor:pointer;transition:all .15s;
  }
  nav.tabs button:hover{color:var(--text)}
  nav.tabs button.on{background:var(--panel-solid);color:var(--text);
                     box-shadow:0 1px 3px rgba(15,23,42,.13)}

  /* ---------- body ---------- */
  main{flex:1;min-height:0;overflow-y:auto;padding-right:2px}
  section{display:none}
  section.on{display:block;animation:fade .16s ease-out}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

  .card{
    background:var(--panel);
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    border:1px solid var(--stroke);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:15px 17px;
  }
  .card + .card{margin-top:12px}

  /* ---------- live readout ---------- */
  .readout{display:grid;grid-template-columns:repeat(3,1fr);gap:13px 10px}
  .readout .k{font-size:10.5px;color:var(--faint);letter-spacing:.04em;
              text-transform:uppercase;font-weight:600}
  .readout .v{font-size:14px;margin-top:3px;font-variant-numeric:tabular-nums;
              font-feature-settings:"tnum";word-break:break-word}
  .readout .v.mono{font-family:"Cascadia Mono",Consolas,monospace;font-size:12.5px}
  .detail{font-size:12px;color:var(--muted);line-height:1.5}

  /* ---------- rows ---------- */
  .row{display:flex;align-items:center;justify-content:space-between;
       gap:16px;padding:11px 0;border-bottom:1px solid var(--stroke)}
  .row:last-child{border-bottom:none;padding-bottom:2px}
  .row:first-child{padding-top:2px}
  .row .label{font-weight:500}
  .row .hint{font-size:11.5px;color:var(--faint);margin-top:2px;max-width:420px;
             line-height:1.45}
  .row .ctl{flex:none;display:flex;align-items:center;gap:9px}

  select,input[type=text],input[type=number]{
    font:inherit;font-size:13px;color:var(--text);
    background:var(--panel-solid);
    border:1px solid var(--stroke-strong);border-radius:9px;
    padding:7px 10px;outline:none;min-width:150px;
    transition:border-color .15s,box-shadow .15s;
  }
  select:focus,input:focus{border-color:rgba(21,163,74,.55);
    box-shadow:0 0 0 3px rgba(21,163,74,.13)}
  input[type=number]{width:88px;min-width:0}

  .seg{display:inline-flex;background:rgba(148,163,184,.16);border-radius:10px;
       padding:3px;gap:2px}
  .seg button{
    font:inherit;font-size:12.5px;font-weight:500;color:var(--muted);
    background:transparent;border:none;border-radius:7px;
    padding:6px 13px;cursor:pointer;transition:all .15s;
  }
  .seg button:hover{color:var(--text)}
  .seg button.on{background:var(--panel-solid);color:var(--text);
                 box-shadow:0 1px 3px rgba(15,23,42,.13)}

  .toggle{position:relative;width:42px;height:24px;flex:none;cursor:pointer}
  .toggle input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .track{position:absolute;inset:0;background:rgba(148,163,184,.45);
         border-radius:999px;transition:background .2s}
  .knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
        background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.28);
        transition:transform .2s}
  .toggle input:checked ~ .track{background:var(--accent)}
  .toggle input:checked ~ .knob{transform:translateX(18px)}
  .toggle input:disabled ~ .track{opacity:.45}

  input[type=range]{
    -webkit-appearance:none;appearance:none;width:190px;height:4px;border-radius:2px;
    background:linear-gradient(90deg,var(--accent) var(--fill,50%),
               rgba(148,163,184,.35) var(--fill,50%));
    outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;
    border:1.5px solid var(--accent);box-shadow:0 1px 4px rgba(15,23,42,.22);cursor:pointer;
  }
  .slider-val{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);
              min-width:66px;text-align:right}

  /* ---------- buttons ---------- */
  .btn{
    font:inherit;font-size:13px;font-weight:600;
    border-radius:10px;padding:9px 17px;cursor:pointer;
    border:1px solid var(--stroke-strong);background:var(--panel-solid);
    color:var(--text);transition:all .15s;white-space:nowrap;
  }
  .btn:hover{border-color:rgba(15,23,42,.3);background:#fff}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#129142}
  .btn.danger{background:var(--panel-solid);border-color:rgba(220,38,38,.4);
              color:#b91c1c}
  .btn.danger:hover{background:var(--danger-soft)}
  .btn.sm{padding:7px 13px;font-size:12.5px}
  .btn:disabled{opacity:.5;cursor:default}

  /* ---------- footer ---------- */
  footer{
    flex:none;display:flex;align-items:center;gap:10px;
    padding-top:14px;margin-top:14px;border-top:1px solid var(--stroke);
  }
  .note{font-size:12px;color:var(--faint);margin-left:auto;text-align:right}
  .note.saved{color:#12743a}
  .note.error{color:#b91c1c}

  .about{font-size:12px;color:var(--faint);line-height:1.8;margin-top:12px;
         padding:0 2px}
  code{font-family:"Cascadia Mono",Consolas,monospace;font-size:11.5px;
       background:rgba(15,23,42,.06);padding:1.5px 5px;border-radius:5px}
  .hidden{display:none !important}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="mark" id="mark"><span></span></div>
    <div class="titles">
      <h1>Fermata</h1>
      <div class="sub" data-i18n="app.subtitle"></div>
    </div>
    <div class="spacer"></div>
    <div class="status-pill" id="pill"><span class="dot"></span><span id="pillText"></span></div>
    <button class="btn primary" id="btnToggle"></button>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="status" class="on" data-i18n="tab.status"></button>
    <button data-tab="audio" data-i18n="tab.audio"></button>
    <button data-tab="behaviour" data-i18n="tab.behaviour"></button>
    <button data-tab="app" data-i18n="tab.app"></button>
  </nav>

  <main>
    <!-- ================= STATUS ================= -->
    <section id="tab-status" class="on">
      <div class="card">
        <div class="readout">
          <div><div class="k" data-i18n="st.device"></div>
               <div class="v" id="s-device">—</div></div>
          <div><div class="k" data-i18n="st.uptime"></div>
               <div class="v mono" id="s-uptime">—</div></div>
          <div><div class="k" data-i18n="st.signal"></div>
               <div class="v mono" id="s-signal">—</div></div>
          <div><div class="k" data-i18n="st.level"></div>
               <div class="v mono" id="s-rms">—</div></div>
          <div><div class="k" data-i18n="st.frames"></div>
               <div class="v mono" id="s-frames">—</div></div>
          <div><div class="k" data-i18n="st.errors"></div>
               <div class="v mono" id="s-errors">—</div></div>
        </div>
      </div>
      <div class="card">
        <div class="row">
          <div class="detail" id="statusDetail" style="max-width:100%"></div>
          <div class="ctl"><button class="btn sm" id="btnRefresh"
                                   data-i18n="btn.rescan"></button></div>
        </div>
      </div>
    </section>

    <!-- ================= AUDIO ================= -->
    <section id="tab-audio">
      <div class="card">
        <div class="row">
          <div>
            <div class="label" data-i18n="audio.device"></div>
            <div class="hint" data-i18n="audio.deviceHint"></div>
          </div>
          <div class="ctl"><select id="deviceSelect"></select></div>
        </div>
        <div class="row">
          <div>
            <div class="label" data-i18n="audio.filter"></div>
            <div class="hint" data-i18n="audio.filterHint"></div>
          </div>
          <div class="ctl"><input type="text" id="deviceHint" style="width:170px"></div>
        </div>
      </div>
      <div class="card">
        <div class="row">
          <div>
            <div class="label" data-i18n="audio.signalType"></div>
            <div class="hint" data-i18n="audio.signalHint"></div>
          </div>
          <div class="ctl">
            <div class="seg" id="typeSeg">
              <button data-v="pink"></button>
              <button data-v="white"></button>
              <button data-v="sine"></button>
            </div>
          </div>
        </div>
        <div class="row hidden" id="rowFreq">
          <div>
            <div class="label" data-i18n="audio.frequency"></div>
            <div class="hint" data-i18n="audio.freqHint"></div>
          </div>
          <div class="ctl">
            <input type="number" id="freq" min="20" max="20000" step="100">
            <span class="slider-val" style="min-width:26px"
                  data-i18n="unit.hz"></span>
          </div>
        </div>
        <div class="row">
          <div>
            <div class="label" data-i18n="audio.level"></div>
            <div class="hint" data-i18n="audio.levelHint"></div>
          </div>
          <div class="ctl">
            <input type="range" id="level" min="-90" max="-20" step="1">
            <span class="slider-val" id="levelVal"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= BEHAVIOUR ================= -->
    <section id="tab-behaviour">
      <div class="card">
        <div class="row">
          <div>
            <div class="label" data-i18n="bh.reconnect"></div>
            <div class="hint" data-i18n="bh.reconnectHint"></div>
          </div>
          <div class="ctl">
            <label class="toggle"><input type="checkbox" id="reconnect">
              <span class="track"></span><span class="knob"></span></label>
          </div>
        </div>
        <div class="row">
          <div>
            <div class="label" data-i18n="bh.retry"></div>
            <div class="hint" data-i18n="bh.retryHint"></div>
          </div>
          <div class="ctl">
            <input type="number" id="reconnectDelay" min="1" max="3600" step="1">
            <span class="slider-val" style="min-width:26px"
                  data-i18n="unit.seconds"></span>
          </div>
        </div>
        <div class="row">
          <div>
            <div class="label" data-i18n="bh.wait"></div>
            <div class="hint" data-i18n="bh.waitHint"></div>
          </div>
          <div class="ctl">
            <input type="number" id="waitDevice" min="0" max="86400" step="10">
            <span class="slider-val" style="min-width:26px"
                  data-i18n="unit.seconds"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= APP ================= -->
    <section id="tab-app">
      <div class="card">
        <div class="row">
          <div>
            <div class="label" data-i18n="app.launchAtLogin"></div>
            <div class="hint" id="autostartHint" data-i18n="app.launchHint"></div>
          </div>
          <div class="ctl">
            <label class="toggle"><input type="checkbox" id="launchAtLogin">
              <span class="track"></span><span class="knob"></span></label>
          </div>
        </div>
        <div class="row">
          <div>
            <div class="label" data-i18n="app.startFeeding"></div>
            <div class="hint" data-i18n="app.startFeedingHint"></div>
          </div>
          <div class="ctl">
            <label class="toggle"><input type="checkbox" id="autostartEngine">
              <span class="track"></span><span class="knob"></span></label>
          </div>
        </div>
        <div class="row">
          <div>
            <div class="label" data-i18n="app.startMinimized"></div>
            <div class="hint" data-i18n="app.startMinimizedHint"></div>
          </div>
          <div class="ctl">
            <label class="toggle"><input type="checkbox" id="startMinimized">
              <span class="track"></span><span class="knob"></span></label>
          </div>
        </div>
        <div class="row">
          <div>
            <div class="label" data-i18n="app.closeToTray"></div>
            <div class="hint" data-i18n="app.closeToTrayHint"></div>
          </div>
          <div class="ctl">
            <label class="toggle"><input type="checkbox" id="closeToTray">
              <span class="track"></span><span class="knob"></span></label>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="row">
          <div>
            <div class="label" data-i18n="app.language"></div>
            <div class="hint" data-i18n="app.languageHint"></div>
          </div>
          <div class="ctl">
            <select id="language">
              <option value="auto" data-i18n="lang.auto"></option>
              <option value="en">English</option>
              <option value="zh">简体中文</option>
            </select>
          </div>
        </div>
      </div>
      <div class="about" id="about"></div>
    </section>
  </main>

  <footer>
    <button class="btn primary" id="btnSave" data-i18n="btn.save"></button>
    <button class="btn" id="btnFolder" data-i18n="btn.openFolder"></button>
    <span class="note" id="saveNote"></span>
  </footer>
</div>

<script>

    'app.startFeeding':'启动即开始喂信号','app.startFeedingHint':'无需手动点开始。',
    'app.startMinimized':'启动时最小化到托盘','app.startMinimizedHint':'仅在开机自启时生效。',
    'app.closeToTray':'关闭窗口时最小化到托盘','app.closeToTrayHint':'关掉后，点 X 会退出并停止。',
    'app.language':'界面语言','app.languageHint':'「跟随系统」使用 Windows 显示语言。',
    'app.version':'版本','app.data':'数据目录',
    'lang.auto':'跟随系统',
    'unit.hz':'Hz','unit.seconds':'秒','unit.h':'小时','unit.m':'分','unit.s':'秒',
    'note.saved':'已保存','note.failed':'保存失败',
    'note.autostartFailed':'无法修改开机自启',
  }
};

let lang = 'en';
let devices = [];
let state = null;

const t = k => (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k;

function fmtUptime(s){
  s = Math.max(0, Math.floor(s || 0));
  const sp = lang === 'zh' ? '' : ' ';   // "1小时2分" reads tighter than "1小时 2分"
  if (s < 60) return s + t('unit.s');
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (h) return `${h}${t('unit.h')}${sp}${m}${t('unit.m')}`;
  return `${m}${t('unit.m')}${sp}${sec}${t('unit.s')}`;
}
const fmtNum = n => (n || 0).toLocaleString(lang === 'zh' ? 'zh-CN' : 'en-US');

/* ---- static text ---- */
function applyStatic(){
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const s = t(el.dataset.i18n);
    if (s) el.textContent = s;
  });
  $('typeSeg').querySelectorAll('button').forEach(b => {
    b.textContent = t('audio.type.' + b.dataset.v);
  });
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
}

/* ---- dynamic text ---- */
function paintStatus(){
  const st = (state && state.status) || {};
  const pill = $('pill'), pillText = $('pillText'), mark = $('mark');
  const map = {running:'running', waiting:'waiting',
               reconnecting:'waiting', error:'error'};
  const cls = map[st.state] || '';
  pill.className = 'status-pill ' + cls;
  pillText.textContent = t('state.' + (map[st.state] ? st.state : 'stopped'));
  mark.classList.toggle('live', cls === 'running');

  $('s-device').textContent = st.device_name || (st.running ? '…' : '—');
  $('s-uptime').textContent = st.running ? fmtUptime(st.uptime_s) : '—';
  const sig = state.settings.signal_type;
  $('s-signal').textContent = st.running
    ? t('sig.' + sig) + (sig === 'sine' ? ' @ ' + state.settings.freq_hz + ' Hz' : '')
    : '—';
  $('s-rms').textContent = st.running && st.audio_rms
    ? st.audio_rms.toFixed(6) + '  (' + Number(st.level_dbfs).toFixed(0) + ' dBFS)' : '—';
  $('s-frames').textContent = st.running ? fmtNum(st.frames_delivered) : '—';
  $('s-errors').textContent = st.running ? fmtNum(st.stream_errors || 0) : '—';

  $('btnToggle').textContent = st.running ? t('btn.stop') : t('btn.start');
  $('btnToggle').className = 'btn ' + (st.running ? 'danger' : 'primary');
  // The engine's own detail is English diagnostic prose, so it is only shown
  // verbatim when the message is an error worth reading. Every other state gets
  // a localised sentence written here, where the copy belongs.
  const key = map[st.state] ? st.state : 'stopped';
  $('statusDetail').textContent = t('detail.' + key)
    + (key === 'error' && st.detail ? '  ' + st.detail : '');
}

function paintLevel(){
  const v = Number(state.settings.level_dbfs);
  const r = $('level');
  r.value = v;
  r.style.setProperty('--fill', ((v - r.min) / (r.max - r.min) * 100) + '%');
  $('levelVal').textContent = v.toFixed(0) + ' dBFS';
}

function paintSeg(){
  const cur = state.settings.signal_type;
  $('typeSeg').querySelectorAll('button').forEach(b =>
    b.classList.toggle('on', b.dataset.v === cur));
  $('rowFreq').classList.toggle('hidden', cur !== 'sine');
}

function paintAbout(){
  // textContent for the values: config_path comes from the OS and must not be
  // able to inject markup.
  const a = $('about');
  a.textContent = '';
  a.append(t('app.version') + ': ' + (state.version || '?'));
  a.append(document.createElement('br'));
  a.append(t('app.data') + ': ');
  const code = document.createElement('code');
  code.textContent = state.config_path || '';
  a.append(code);
}

async function loadDevices(){
  devices = await window.pywebview.api.list_devices();
  const sel = $('deviceSelect');
  const cur = state.settings.device_hint || '';
  const norm = s => (s || '').toLowerCase();
  sel.textContent = '';
  let hasMatch = false;
  devices.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d.name;
    const tag = d.host_api.includes('WASAPI') ? '' : ' · ' + d.host_api;
    opt.textContent = d.name + tag + (d.is_default ? '  (' + t('audio.default') + ')' : '');
    if (norm(cur) && norm(d.name).includes(norm(cur))) hasMatch = true;
    sel.append(opt);
  });
  // Keep an explicit entry for a filter that matches nothing right now, so the
  // stored value stays visible instead of silently resetting.
  if (!hasMatch && cur){
    const opt = document.createElement('option');
    opt.value = cur;
    opt.textContent = cur;
    sel.prepend(opt);
  }
  // An explicit "any" row, so an empty setting round-trips. Without it the
  // select always had a value, and pressing Save silently replaced "system
  // default" with whichever device happened to be listed first.
  const any = document.createElement('option');
  any.value = '';
  any.textContent = t('audio.anyDevice');
  sel.prepend(any);

  const hit = cur ? [...sel.options].find(o => o.value && norm(o.value).includes(norm(cur))) : null;
  sel.value = hit ? hit.value : (cur || '');
}

function fillForm(){
  const s = state.settings;
  $('deviceHint').value = s.device_hint || '';
  $('freq').value = s.freq_hz;
  $('reconnect').checked = !!s.reconnect;
  $('reconnectDelay').value = s.reconnect_delay_s;
  $('waitDevice').value = s.wait_device_s;
  $('autostartEngine').checked = !!s.autostart_engine;
  $('startMinimized').checked = !!s.start_minimized;
  $('closeToTray').checked = !!s.close_to_tray;
  // The registry is the source of truth for autostart, not the settings file.
  $('launchAtLogin').checked = !!state.autostart_enabled;
  $('language').value = s.language || 'auto';
  paintSeg(); paintLevel(); paintAbout();
}

async function refresh(full){
  if (full){
    state = await window.pywebview.api.get_state();
    // Adopt the language the app resolved: this is what turns "auto" into a
    // concrete code, and both halves must agree or the tray and window differ.
    lang = state.language || 'en';
    applyStatic();
    await loadDevices();
    fillForm();
  } else {
    state.status = await window.pywebview.api.status();
  }
  paintStatus();
}

function collect(){
  return Object.assign({}, state.settings, {
    device_hint: $('deviceSelect').value || $('deviceHint').value,
    signal_type: $('typeSeg').querySelector('button.on').dataset.v,
    level_dbfs: Number($('level').value),
    freq_hz: Number($('freq').value),
    reconnect: $('reconnect').checked,
    reconnect_delay_s: Number($('reconnectDelay').value),
    wait_device_s: Number($('waitDevice').value),
    launch_at_login: $('launchAtLogin').checked,
    autostart_engine: $('autostartEngine').checked,
    start_minimized: $('startMinimized').checked,
    close_to_tray: $('closeToTray').checked,
    language: $('language').value,
  });
}

function flashNote(msg, ok){
  const n = $('saveNote');
  n.textContent = msg;
  n.className = 'note ' + (ok ? 'saved' : 'error');
  setTimeout(() => { n.textContent = ''; n.className = 'note'; }, 2400);
}

/* ---- events ---- */
$('tabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  $('tabs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('main section').forEach(s =>
    s.classList.toggle('on', s.id === 'tab-' + b.dataset.tab));
};

$('btnToggle').onclick = async () => {
  const wasRunning = !!(state.status || {}).running;
  $('btnToggle').disabled = true;
  if (wasRunning) await window.pywebview.api.stop_engine();
  else await window.pywebview.api.start_engine();
  await refresh(false);
  $('btnToggle').disabled = false;
};

$('btnRefresh').onclick = () => refresh(true);

$('btnSave').onclick = async () => {
  const res = await window.pywebview.api.save_settings(collect());
  await refresh(true);
  flashNote(res.ok ? t('note.saved') : t('note.failed') + ': ' + res.message, res.ok);
};

$('btnFolder').onclick = () => window.pywebview.api.open_data_folder();

$('typeSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  $('typeSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  paintSeg();
};

$('level').oninput = () => {
  state.settings.level_dbfs = Number($('level').value);
  paintLevel();
};

// Mirror the pick into the filter box, but do not wipe it when "Any device" is
// chosen: the filter is exactly what you would want to keep in that case.
$('deviceSelect').onchange = e => {
  if (e.target.value) $('deviceHint').value = e.target.value;
};

$('launchAtLogin').onchange = async e => {
  const r = await window.pywebview.api.set_autostart(e.target.checked);
  if (!r.ok){
    e.target.checked = !e.target.checked;
    flashNote(t('note.autostartFailed') + ': ' + r.message, false);
  }
};

$('language').onchange = async () => {
  // Apply and persist straight away: a language picker that needs a separate
  // Save press reads as broken.
  state.settings.language = $('language').value;
  const res = await window.pywebview.api.save_settings(collect());
  await refresh(true);
  if (res.ok) flashNote(t('note.saved'), true);
};

window.addEventListener('pywebviewready', () => refresh(true));
setInterval(() => { if (state) refresh(false); }, 1000);
</script>
</body>
</html>
